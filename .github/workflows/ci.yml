# Every step runs a fixed command. No workflow input, event payload or other
# untrusted value is interpolated into a run: block anywhere in this file.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and dependencies
        run: pip install -e ".[dev]"
      - name: black
        run: black --check .
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy .
      - name: bandit
        run: bandit -c pyproject.toml -r .
      - name: pip-audit
        run: pip-audit --skip-editable
      # Coverage is enforced once, on the platform where every test can run.
      # The CLI's broken-pipe handling needs POSIX pipe semantics, so demanding
      # 100% on Windows would fail over code Windows cannot reach, not over a
      # gap in the suite. The other platforms still run every test.
      - name: pytest with the coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: pytest
      - name: pytest
        if: matrix.os != 'ubuntu-latest'
        run: pytest --no-cov
