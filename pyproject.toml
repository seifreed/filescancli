[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filescancli"
# The version lives in filescanio/__init__.py alone: a release bumps one
# line, and `filescan --version` can never disagree with the wheel.
dynamic = ["version"]
description = "CLI and client library for the filescan.io API"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marc Rivero" }]
dependencies = ["httpx>=0.28", "prettytable>=3.18"]
keywords = ["filescan", "malware", "sandbox", "threat-intelligence", "sarif"]
# No "License ::" classifier: the SPDX `license` field above supersedes it
# (PEP 639) and PyPI rejects a distribution that declares both.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

# Development tooling lives in this same file, never in a separate
# requirements file; it must not be installed into a consumer's environment.
[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "black>=25.1",
    "ruff>=0.12",
    "mypy>=1.16",
    "bandit>=1.8",
    "pip-audit>=2.9",
]

[project.scripts]
filescan = "filescanio.cli:main"

[project.urls]
Homepage = "https://github.com/seifreed/filescancli"
Repository = "https://github.com/seifreed/filescancli"
Issues = "https://github.com/seifreed/filescancli/issues"

[tool.hatch.version]
path = "filescanio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["filescanio"]

[tool.black]
target-version = ["py314"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.mypy]
strict = true
python_version = "3.14"
exclude = ["venv"]

[tool.bandit]
# Test code, where a bare assert is the point rather than a finding.
exclude_dirs = ["venv", "tests", "smoke", "posix"]

[tool.pytest.ini_options]
# posix/ is collected but not measured: it holds the tests Windows has to skip,
# and a skipped test counts as uncovered. smoke/ needs a real API key, so it is
# not collected at all and runs on demand with `pytest smoke`.
testpaths = ["tests", "posix"]
addopts = """
    --cov=filescanio --cov=tests
    --cov-report=term-missing --cov-fail-under=100
"""

[tool.coverage.run]
branch = true
